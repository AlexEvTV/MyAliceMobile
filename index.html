<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Моя Алиса</title>
    <style>
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #f0f0f0;
            height: 100vh;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }
        
        .phone {
            width: calc(100vh * (9/16));
            height: 100vh;
            max-width: 100%;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        
        .room {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            background-size: cover;
            background-position: center;
        }
        
        #smileBg {
            background-image: url('SmileBg.png');
            display: block;
        }
        
        #foodBg {
            background-image: url('FoodBg.png');
        }
        
        #toiletBg {
            background-image: url('ToiletBg.png');
        }
        
        #sleepBg {
            background-image: url('SleepBg.png');
        }
        
        .level-container {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        
        .level-display {
            width: 12vh;
            height: 12vh;
            background: #ccc;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4vh;
            font-weight: bold;
            box-shadow: 0 0 2vh rgba(0,0,0,0.3);
            position: relative;
        }
        
        .level-progress {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(#4CAF50 0%, #4CAF50 var(--progress), rgba(0,0,0,0.1) var(--progress), rgba(0,0,0,0.1) 100%);
            transform: rotate(-90deg);
            z-index: 1;
        }
        
        .level-number {
            position: relative;
            z-index: 2;
            width: 10vh;
            height: 10vh;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 1vh rgba(0,0,0,0.2);
        }
        
        .buttons-container {
            display: flex;
            gap: 1vh;
            margin-top: 1vh;
            flex-wrap: wrap;
            justify-content: center;
            width: 12vh;
        }
        
        .settings-btn {
            font-size: 2.5vh;
            cursor: pointer;
            transition: transform 0.2s;
            width: 5vh;
            height: 5vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 1vh rgba(0,0,0,0.2);
        }
        
        .settings-btn:active {
            transform: scale(0.8);
        }
        
        .click-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.8);
            padding: 1vh 2vh;
            border-radius: 2vh;
            font-size: 3vh;
            box-shadow: 0 0 1vh rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            z-index: 10;
        }
        
        .click-counter::after {
            content: "👆";
            margin-left: 0.5vh;
        }
        
        .crystal-counter {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(255,255,255,0.8);
            padding: 1vh 2vh;
            border-radius: 2vh;
            font-size: 3vh;
            box-shadow: 0 0 1vh rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            z-index: 10;
        }
        
        .alice-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 25vh;
            height: 25vh;
            cursor: pointer;
            z-index: 5;
        }
        
        .alice {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.1s ease;
        }
        
        .buttons {
            display: flex;
            justify-content: space-around;
            width: 100%;
            padding: 2vh 0;
            position: absolute;
            bottom: 0;
            background: rgba(0,0,0,0.2);
            z-index: 10;
        }
        
        .btn {
            width: 8vh;
            height: 8vh;
            border-radius: 50%;
            background: #FF4500;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 3.5vh;
            cursor: pointer;
            margin: 0 1vh;
            box-shadow: 0 0.4vh 1vh rgba(0,0,0,0.2);
            transition: transform 0.2s, background 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .btn-progress {
            position: absolute;
            width: 100%;
            bottom: 0;
            left: 0;
            background: #4CAF50;
            transition: height 0.3s ease;
            z-index: 1;
        }
        
        .btn-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }
        
        .btn.completed .btn-content {
            background: #4CAF50;
        }
        
        .btn:active {
            transform: scale(0.9);
        }
        
        .light-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 8vh;
            height: 8vh;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5vh;
            cursor: pointer;
            box-shadow: 0 0 2vh rgba(0,0,0,0.3);
            z-index: 15;
            display: none;
            transition: transform 0.2s;
        }
        
        .light-switch:active {
            transform: scale(0.9);
        }
        
        .dark-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 5;
            display: none;
        }
        
        .sleep-timer {
            position: absolute;
            top: 20px;
            right: 100px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 1vh 2vh;
            border-radius: 2vh;
            font-size: 3vh;
            z-index: 15;
            display: none;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .modal {
            background: white;
            padding: 3vh;
            border-radius: 2vh;
            width: 70%;
            max-width: 300px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s;
        }
        
        .modal-overlay.active .modal {
            transform: scale(1);
        }
        
        .modal-title {
            font-size: 3vh;
            margin-bottom: 2vh;
        }
        
        .modal-buttons {
            display: flex;
            justify-content: space-around;
            margin-top: 3vh;
        }
        
        .modal-btn {
            padding: 1vh 2vh;
            border-radius: 1vh;
            font-size: 2.5vh;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 6vh;
            text-align: center;
        }
        
        .modal-btn-yes {
            background: #ccc;
            color: black;
        }
        
        .modal-btn-no {
            background: #FF4500;
            color: white;
        }
        
        .modal-btn:active {
            opacity: 0.8;
            transform: scale(0.95);
        }
        
        .settings-modal {
            width: 80%;
            max-width: 350px;
        }
        
        .settings-option {
            padding: 2vh;
            margin: 1vh 0;
            background: #f5f5f5;
            border-radius: 1vh;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .settings-option:active {
            background: #e0e0e0;
        }
        
        .manual-image {
            width: 100%;
            max-height: 60vh;
            object-fit: contain;
            margin: 2vh 0;
        }
        
        .back-btn {
            padding: 1.5vh;
            background: #FF4500;
            color: white;
            border-radius: 1vh;
            margin-top: 2vh;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .manual-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 2vh;
        }
        
        .manual-btn {
            padding: 1vh 2vh;
            border-radius: 1vh;
            font-size: 2vh;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 8vh;
        }
        
        .manual-btn-prev {
            background: #ccc;
            color: black;
        }
        
        .manual-btn-next {
            background: #4CAF50;
            color: white;
        }
        
        .manual-btn-done {
            background: #4CAF50;
            color: white;
            display: none;
        }
        
        @keyframes aliceClick {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(0.98) translateY(5px); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        
        .click-animation {
            animation: aliceClick 0.2s ease;
        }
        
        /* Стили для еды */
        .food-items {
            position: absolute;
            bottom: 12vh;
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 5;
        }
        
        .food-item {
            width: 8vh;
            height: 8vh;
            font-size: 5vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            user-select: none;
            position: relative;
            transition: transform 0.2s;
        }
        
        .food-item:active {
            cursor: grabbing;
        }
        
        .food-item.dragging {
            position: absolute;
            z-index: 100;
            transform: scale(1.2);
            pointer-events: none;
        }
        
        @keyframes eatAnimation {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        
        .eating {
            animation: eatAnimation 0.3s forwards;
        }
        
        /* Стили для туалетной двери */
        .toilet-door {
            position: absolute;
            width: 15vh;
            height: 25vh;
            right: 10%;
            top: 50%;
            transform: translateY(-50%);
            background-color: #d3d3d3;
            border: 2px solid #999;
            border-radius: 1vh;
            cursor: grab;
            z-index: 6;
            transition: transform 0.3s ease;
            touch-action: none;
        }
        
        .toilet-door:active {
            cursor: grabbing;
        }
        
        /* Стили для модального окна костюмов */
        .costumes-modal {
            width: 90%;
            max-width: 400px;
            height: 70vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .costumes-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1vh;
        }
        
        .costume-category {
            margin-bottom: 2vh;
        }
        
        .costume-category-title {
            font-size: 2.5vh;
            margin-bottom: 1vh;
            color: #555;
        }
        
        .costume-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5vh;
        }
        
        .costume-item {
            background: #f5f5f5;
            border-radius: 1vh;
            padding: 1.5vh;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .costume-item:active {
            transform: scale(0.95);
        }
        
        .costume-item.locked {
            opacity: 0.6;
            position: relative;
        }
        
        .costume-item.locked::after {
            content: "🔒";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3vh;
        }
        
        .costume-image {
            width: 100%;
            height: 10vh;
            object-fit: contain;
            margin-bottom: 1vh;
        }
        
        .costume-name {
            font-size: 2vh;
            font-weight: bold;
            margin-bottom: 0.5vh;
        }
        
        .costume-info {
            font-size: 1.8vh;
            color: #777;
        }
        
        .costume-price {
            font-size: 1.8vh;
            margin-top: 0.5vh;
            color: #4CAF50;
        }
        
        .costume-price.locked {
            color: #FF4500;
        }
        
        .costume-scrollbar {
            height: 0.5vh;
            background: #eee;
            border-radius: 0.5vh;
            margin-top: 1vh;
            position: relative;
        }
        
        .costume-scrollbar-thumb {
            position: absolute;
            height: 100%;
            background: #FF4500;
            border-radius: 0.5vh;
            width: 30%;
            left: 0;
        }
        
        .selected-costume {
            border: 2px solid #4CAF50;
            background: #e8f5e9;
        }
        
        /* Стили для модального окна магазина */
        .shop-modal {
            width: 90%;
            max-width: 400px;
            height: 70vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .shop-container {
            flex-grow: 1;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 1vh;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 0;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
        }
        
        .shop-category {
            margin-bottom: 0;
            scroll-snap-align: start;
            min-width: 100%;
        }
        
        .shop-category-title {
            font-size: 2.5vh;
            margin-bottom: 1vh;
            color: #555;
        }
        
        .shop-items {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0;
        }
        
        .shop-item {
            background: transparent;
            border-radius: 1vh;
            padding: 0;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            height: 20vh;
            width: 100%;
            margin: 0;
        }
        
        .shop-item:active {
            transform: scale(0.95);
        }
        
        .shop-item.locked {
            opacity: 0.6;
            position: relative;
        }
        
        .shop-item.locked::after {
            content: "🔒";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3vh;
        }
        
        .shop-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .shop-name {
            font-size: 2.5vh;
            font-weight: bold;
            margin-bottom: 0.5vh;
            display: none;
        }
        
        .shop-description {
            font-size: 1.8vh;
            color: #777;
            margin-bottom: 1vh;
            display: none;
        }
        
        .shop-price {
            font-size: 2vh;
            margin-top: 0.5vh;
            color: #4CAF50;
            font-weight: bold;
            display: none;
        }
        
        .shop-price.locked {
            color: #FF4500;
        }
        
        .shop-scrollbar {
            height: 0.5vh;
            background: #eee;
            border-radius: 0.5vh;
            margin-top: 1vh;
            position: relative;
        }
        
        .shop-scrollbar-thumb {
            position: absolute;
            height: 100%;
            background: #FF4500;
            border-radius: 0.5vh;
            width: 30%;
            left: 0;
        }
        
        /* Стили для ввода промокода */
        .promo-section {
            margin-top: 2vh;
            padding-top: 2vh;
            border-top: 1px solid #eee;
            max-width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 1vh;
        }
        
        .promo-input {
            flex: 1;
            padding: 1.5vh;
            border: 1px solid #ccc;
            border-radius: 1vh;
            font-size: 2vh;
            text-align: center;
        }
        
        .promo-btn {
            padding: 1.5vh;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 1vh;
            cursor: pointer;
            font-size: 2vh;
            display: flex;
            justify-content: center;
            align-items: center;
            width: auto;
            min-width: 10vh;
        }
        
        .promo-btn:active {
            background: #3e8e41;
        }
        
        .promo-result {
            margin-top: 2vh;
            font-size: 2vh;
            color: #333;
            max-width: 100%;
            overflow-wrap: break-word;
        }
        
        .promo-error {
            color: #FF4500;
        }
        
        .promo-success {
            color: #4CAF50;
        }
        
        /* Кнопка магазина под кнопками настроек */
        .shop-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 1vh;
        }
        
        .shop-btn {
            font-size: 2.5vh;
            cursor: pointer;
            transition: transform 0.2s;
            width: 5vh;
            height: 5vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 1vh rgba(0,0,0,0.2);
        }
        
        .shop-btn:active {
            transform: scale(0.8);
        }
        
        /* Модальное окно подтверждения очистки данных */
        .confirm-clear-modal {
            width: 80%;
            max-width: 300px;
        }
        
        .confirm-clear-text {
            font-size: 2.5vh;
            margin-bottom: 3vh;
        }
        
        /* Модальное окно результата покупки */
        .purchase-modal {
            width: 80%;
            max-width: 300px;
        }
        
        .purchase-result {
            font-size: 2.5vh;
            margin-bottom: 3vh;
        }
        
        /* Стили для пасса */
        .pass-modal {
            width: 90%;
            max-width: 400px;
            height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: url('AETpassBg.png');
            background-size: cover;
        }

        .pass-header {
            width: 100%;
            height: 15vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2vh;
        }

        .pass-header-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .pass-tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 2vh;
        }

        .pass-tab {
            padding: 1vh 2vh;
            background: #f5f5f5;
            border-radius: 1vh;
            cursor: pointer;
            font-size: 2vh;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 10vh;
        }

        .pass-tab.active {
            background: #FF4500;
            color: white;
        }

        .pass-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1vh;
            display: flex;
            flex-direction: column;
        }

        .pass-item {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 1vh;
            padding: 1.5vh;
            margin-bottom: 2vh;
            display: flex;
            align-items: center;
            position: relative;
        }

        .pass-item-image {
            width: 10vh;
            height: 10vh;
            object-fit: contain;
            margin-right: 2vh;
        }

        .pass-item-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .pass-item-name {
            font-size: 2vh;
            font-weight: bold;
            margin-bottom: 1vh;
        }

        .pass-item-task {
            font-size: 1.8vh;
            color: #555;
            margin-bottom: 1vh;
        }

        .pass-progress-container {
            width: 100%;
            height: 1vh;
            background: #ddd;
            border-radius: 0.5vh;
            margin-top: 1vh;
            position: relative;
        }

        .pass-progress-bar {
            position: absolute;
            height: 100%;
            background: #FF4500;
            border-radius: 0.5vh;
            width: 0%;
            transition: width 0.3s;
        }

        .pass-item-premium {
            width: 10vh;
            height: 10vh;
            object-fit: contain;
            margin-left: 2vh;
            position: relative;
        }

        .pass-item-premium.locked::after {
            content: "🔒";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3vh;
        }


        .pass-item-claim {
            padding: 1vh 2vh;
            background: gold;
            color: #333;
            border: none;
            border-radius: 1vh;
            font-size: 2vh;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1vh;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 10vh;
        }

        .pass-item-claim-regular {
            background: #4CAF50;
            color: white;
            margin-right: 1vh;
        }

        .pass-item-claim-premium {
            background: gold;
            color: #333;
        }

        .selected-costume {
            border: 2px solid #4CAF50;
            background: #e8f5e9;
        }

        .pass-scrollbar {
            height: 0.5vh;
            background: #eee;
            border-radius: 0.5vh;
            margin-top: 1vh;
            position: relative;
        }

        .pass-scrollbar-thumb {
            position: absolute;
            height: 100%;
            background: #FF4500;
            border-radius: 0.5vh;
            width: 30%;
            left: 0;
        }

        .pass-footer {
            display: flex;
            justify-content: space-between;
            padding: 1vh;
            gap: 1vh;
        }

        .buy-pass-btn {
            padding: 1vh 2vh;
            background: gold;
            color: #333;
            border: none;
            border-radius: 1vh;
            font-size: 2vh;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        function checkQuestsCompletion() {
            // Проверяем, не нужно ли сбросить счетчик кликов для квестов (например, при новом дне)
            const now = Date.now();
            const oneDay = 24 * 60 * 60 * 1000; // 24 часа в миллисекундах
            if (now - questClicks.lastResetTime > oneDay) {
                questClicks.clicksForQuests = 0;
                questClicks.lastResetTime = now;
                localStorage.setItem('aliceQuestClicks', JSON.stringify(questClicks));
            }
            
            for (const [key, quest] of Object.entries(quests)) {
                if (!completedQuests[key]) {
                    let completed = true;
                    
                    if (quest.need.clicks && questClicks.clicksForQuests < quest.need.clicks) {
                        completed = false;
                    }
                    
                    if (quest.need.level && level < quest.need.level) {
                        completed = false;
                    }
                    
                    if (completed) {
                        completedQuests[key] = true;
                        tokens += quest.giftTokens;
                        localStorage.setItem(`aliceTokens_season_${passConfig.Season}`, tokens.toString());
                        localStorage.setItem('aliceCompletedQuests', JSON.stringify(completedQuests));
                        
                        // Показываем уведомление о завершении квеста
                        showRewardNotification(`Получено ${quest.giftTokens} токенов!`);
                    }
                }
            }
        }

function collectPassReward(key, reward, isPremium) {
    let message = "Получено: ";
    
    if (isPremium && hasPremiumPass) {
        // Выдаем премиум награду
        if (reward.giftPremium.type === "clicks") {
            clickCount += reward.giftPremium.value;
            message += `${reward.giftPremium.value} кликов (премиум)`;
        } else if (reward.giftPremium.type === "crystals") {
            crystals += reward.giftPremium.value;
            message += `${reward.giftPremium.value} кристаллов (премиум)`;
        } else if (reward.giftPremium.type === "costume") {
            unlockedCostumes[reward.giftPremium.value] = true;
            message += `костюм "${costumes[reward.giftPremium.value].name}" (премиум)`;
        }
        
        // Помечаем награду как полученную
        collectedPassRewards[key + '_premium'] = true;
    } else {
        // Выдаем обычную награду
        if (reward.giftUsually.type === "clicks") {
            clickCount += reward.giftUsually.value;
            message += `${reward.giftUsually.value} кликов`;
        } else if (reward.giftUsually.type === "crystals") {
            crystals += reward.giftUsually.value;
            message += `${reward.giftUsually.value} кристаллов`;
        } else if (reward.giftUsually.type === "costume") {
            unlockedCostumes[reward.giftUsually.value] = true;
            message += `костюм "${costumes[reward.giftUsually.value].name}"`;
        }
        
        // Помечаем награду как полученную
        collectedPassRewards[key] = true;
    }
    
    // Обновляем данные
    localStorage.setItem('aliceClickCount', clickCount.toString());
    localStorage.setItem('aliceCrystals', crystals.toString());
    localStorage.setItem('aliceUnlockedCostumes', JSON.stringify(unlockedCostumes));
    localStorage.setItem(`aliceCollectedPassRewards_season_${passConfig.Season}`, JSON.stringify(collectedPassRewards));
    
    // Обновляем счетчики и пасс
    updateCounters();
    showPassRewards();
    
    // Показываем уведомление
    showRewardNotification(message);
}
        
        function showQuests() {

            for (const [key, quest] of Object.entries(quests)) {

                questItem.className = 'pass-item';

                questItem.innerHTML = `

        function setupPassScroll() {
            const container = passContainer;
            const scrollbar = document.getElementById('passScrollbarThumb');
            
            function updateScrollbar() {
                const scrollRatio = container.scrollTop / (container.scrollHeight - container.clientHeight);
                const thumbPosition = scrollRatio * (container.clientWidth - scrollbar.clientWidth);
                scrollbar.style.left = `${thumbPosition}px`;
            }
            
            container.addEventListener('scroll', updateScrollbar);
            
            // Обработчик для перемещения скролла при перетаскивании ползунка
            let isDragging = false;
            let startX;
            
            scrollbar.addEventListener('mousedown', function(e) {
                isDragging = true;
                startX = e.clientX;
                e.preventDefault();
            });
            
            scrollbar.addEventListener('touchstart', function(e) {
                isDragging = true;
                startX = e.touches[0].clientX;
                e.preventDefault();
            }, { passive: false });
            
            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                
                const deltaX = e.clientX - startX;
                const containerWidth = container.clientWidth;
                const scrollWidth = container.scrollWidth;
                
                const scrollRatio = deltaX / containerWidth;
                container.scrollTop = scrollRatio * (scrollWidth - container.clientWidth);
                
                startX = e.clientX;
            });
            
            document.addEventListener('touchmove', function(e) {
                if (!isDragging) return;
                
                const deltaX = e.touches[0].clientX - startX;
                const containerWidth = container.clientWidth;
                const scrollWidth = container.scrollWidth;
                
                const scrollRatio = deltaX / containerWidth;
                container.scrollTop = scrollRatio * (scrollWidth - container.clientWidth);
                
                startX = e.touches[0].clientX;
                e.preventDefault();
            }, { passive: false });
            
            document.addEventListener('mouseup', function() {
                isDragging = false;
            });
            
            document.addEventListener('touchend', function() {
                isDragging = false;
            });
            
            updateScrollbar();
        }

        function applyPromoCode() {
            const promoCode = promoCodeInput.value.trim().toUpperCase();
            const resultElement = promoResult;
            
            if (!promoCode) {
                resultElement.textContent = "Введите промокод";
                resultElement.className = "promo-result promo-error";
                return;
            }
            
            // Проверяем, использовался ли уже этот промокод
            if (usedPromoCodes.includes(promoCode)) {
                resultElement.textContent = "Этот промокод уже был использован";
                resultElement.className = "promo-result promo-error";
                return;
            }
            
            // Проверяем, существует ли промокод
            if (!promoCodes[promoCode]) {
                resultElement.textContent = "Неверный промокод";
                resultElement.className = "promo-result promo-error";
                return;
            }
            
            // Активируем промокод
            const promo = promoCodes[promoCode];
            let message = "Промокод активирован!";
            
            switch(promo.type) {
                case "clicks":
                    clickCount += promo.value;
                    localStorage.setItem('aliceClickCount', clickCount.toString());
                    message += ` Получено ${promo.value} кликов.`;
                    break;
                    
                case "costume":
                    unlockedCostumes[promo.value] = true;
                    localStorage.setItem('aliceUnlockedCostumes', JSON.stringify(unlockedCostumes));
                    message += ` Разблокирован костюм "${costumes[promo.value].name}".`;
                    
                    // Если это первый костюм, автоматически выбираем его
                    if (selectedCostume === 'default' && promo.value !== 'default') {
                        selectedCostume = promo.value;
                        localStorage.setItem('aliceSelectedCostume', selectedCostume);
                        loadSelectedCostume();
                    }
                    break;
                    
                case "crystals":
                    crystals += promo.value;
                    localStorage.setItem('aliceCrystals', crystals.toString());
                    message += ` Получено ${promo.value} кристаллов.`;
                    break;
            }
            
            // Добавляем промокод в список использованных
            usedPromoCodes.push(promoCode);
            localStorage.setItem('aliceUsedPromoCodes', JSON.stringify(usedPromoCodes));
            
            // Обновляем счетчики
            updateCounters();
            checkUnlockedCostumes();
            
            // Показываем результат
            resultElement.textContent = message;
            resultElement.className = "promo-result promo-success";
            
            // Очищаем поле ввода
            promoCodeInput.value = "";
        }

        function addXP(amount) {
            xp += amount;
            localStorage.setItem('aliceXP', xp.toString());
            
            // Проверяем, достигли ли нового уровня (XP для следующего уровня = 100 + (текущий уровень * 20))
            const xpNeeded = 100 + (level * 20);
            if (xp >= xpNeeded) {
                level++;
                xp = 0; // Сбрасываем XP при достижении нового уровня
                localStorage.setItem('aliceLevel', level.toString());
                localStorage.setItem('aliceXP', '0');
                updateCounters();
                
                // Проверяем, разблокировались ли новые костюмы
                checkUnlockedCostumes();
                // Проверяем новые акции
                checkNewStocks();
                // Проверяем квесты
                checkQuestsCompletion();
            }
            
            updateLevelProgress();
        }

        function setupAliceClick() {
            const costume = costumes[selectedCostume];
            const originalSrc = costume ? costume.mainImage : 'Alice.png';
            const tapSrc = costume ? costume.tapImage : 'AliceTap.png';
            
            aliceContainer.addEventListener('click', function() {
                const now = Date.now();
                if (now - lastClickTime < clickDelay) return; // Проверяем задержку между кликами
                lastClickTime = now;
                
                this.classList.add('click-animation');
                setTimeout(() => {
                    this.classList.remove('click-animation');
                }, 200);
                
                // Меняем изображение на короткое время

                aliceImg.src = currentCostume ? currentCostume.tapImage : 'AliceTap.png';

                questClicks.clicksForQuests++; // Увеличиваем счетчик кликов для квестов
                localStorage.setItem('aliceClickCount', clickCount.toString());

                checkQuestsCompletion();

                if (!actionsCompleted.smile) {
                    actionsProgress.smile = Math.min(100, clickCount * 10); // 10 кликов = 100%
                    updateActionsProgress();
                }
                
                // Проверяем, выполнено ли действие "улыбка"
                if (clickCount >= 10 && !actionsCompleted.smile) {
                    actionsCompleted.smile = true;
                    localStorage.setItem('aliceActionsCompleted', JSON.stringify(actionsCompleted));
                    smileBtn.classList.add('completed');
                    // Даем меньше XP за выполнение действия на высоких уровнях
                    const xpReward = Math.max(5, 25 - Math.floor(level / 2));
                    addXP(xpReward);
                    checkActionsCompletion();
                }
            });

            for (const [key, costume] of Object.entries(costumes)) {
                if (!unlockedCostumes[key] && 
                    clickCount >= costume.clicksRequired && 
                    level >= costume.levelRequired) {
                    unlockedCostumes[key] = true;
                    updated = true;
                }
            }
            
            if (updated) {
                localStorage.setItem('aliceUnlockedCostumes', JSON.stringify(unlockedCostumes));
                if (costumesModal.classList.contains('active')) {
                    showCostumes();

        function startSleepTimer() {
            if (isSleeping) return;
            
            isSleeping = true;
            sleepTimeLeft = 60; // Время секунды в минуты
            sleepStartTime = Date.now();
            lastUpdateTime = Date.now();
            accumulatedSleepTime = 0;
            updateSleepTimerDisplay();
            sleepTimer.style.display = 'block';
            
            sleepInterval = setInterval(updateSleepTime, 1000);
        }
        
        function updateSleepTime() {
            const now = Date.now();
            const deltaTime = now - lastUpdateTime;
            lastUpdateTime = now;
            
            if (!isLightOn) { // Таймер работает только когда свет выключен
                accumulatedSleepTime += deltaTime;
                const timePassed = Math.floor(accumulatedSleepTime / 1000);
                sleepTimeLeft = Math.max(0, 60 - timePassed);
                updateSleepTimerDisplay();
                
                // Обновляем прогресс для сна
                if (!actionsCompleted.sleep) {
                    actionsProgress.sleep = Math.min(100, (60 - sleepTimeLeft) / 60 * 100);
                    updateActionsProgress();
                }
                
                if (sleepTimeLeft <= 0) {
                    clearInterval(sleepInterval);
                    isSleeping = false;
                    
                    // Помечаем действие как выполненное
                    if (!actionsCompleted.sleep) {
                        actionsCompleted.sleep = true;
                        localStorage.setItem('aliceActionsCompleted', JSON.stringify(actionsCompleted));
                        sleepBtn.classList.add('completed');
                        // Даем меньше XP за выполнение действия на высоких уровнях
                        const xpReward = Math.max(5, 25 - Math.floor(level / 2));
                        addXP(xpReward);
                        checkActionsCompletion();
                    }
                    
                    sleepTimer.style.display = 'none';
                }
            }
        }
        
        function updateSleepTimerDisplay() {
            const minutes = Math.floor(sleepTimeLeft / 60);
            const seconds = sleepTimeLeft % 60;
            sleepTimer.textContent = `${minutes}:${seconds < 10 ? '0' + seconds : seconds}`;
        }
        
        function spawnFood() {

            isFoodSpawning = true;

            foodTypes.forEach(food => {

                foodItem.dataset.food = food;

                foodItems.appendChild(foodItem);

        function setupFoodInteraction() {
            document.querySelectorAll('.food-item').forEach(food => {
                food.addEventListener('mousedown', startDrag);
                food.addEventListener('touchstart', startDrag, { passive: false });
            });
            
            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, { passive: false });
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
        }
        
        function startDrag(e) {
            e.preventDefault();
            activeFoodItem = e.target.closest('.food-item');
            if (!activeFoodItem) return;
            
            const rect = activeFoodItem.getBoundingClientRect();
            
            if (e.type === 'mousedown') {
                startX = e.clientX;
                startY = e.clientY;
            } else if (e.type === 'touchstart') {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }
            
            offsetX = startX - rect.left;
            offsetY = startY - rect.top;
            
            activeFoodItem.classList.add('dragging');
            activeFoodItem.style.position = 'fixed';
            activeFoodItem.style.left = `${rect.left}px`;
            activeFoodItem.style.top = `${rect.top}px`;
        }
        
        function drag(e) {
            if (!activeFoodItem) return;
            e.preventDefault();
            
            let clientX, clientY;
            if (e.type === 'mousemove') {
                clientX = e.clientX;
                clientY = e.clientY;
            } else if (e.type === 'touchmove') {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            
            activeFoodItem.style.left = `${clientX - offsetX}px`;
            activeFoodItem.style.top = `${clientY - offsetY}px`;
        }
        
        function endDrag(e) {
            if (!activeFoodItem) return;
            
            const aliceRect = foodAliceContainer.getBoundingClientRect();
            const foodRect = activeFoodItem.getBoundingClientRect();
            
            if (checkCollision(foodRect, aliceRect)) {
                activeFoodItem.classList.add('eating');
                setTimeout(() => {
                    foodItemsEaten++;
                    
                    // Обновляем прогресс для еды
                    if (!actionsCompleted.food) {
                        actionsProgress.food = Math.min(100, foodItemsEaten / 3 * 100);
                        updateActionsProgress();
                    }
                    
                    if (foodItemsEaten >= 3 && !actionsCompleted.food) {
                        actionsCompleted.food = true;
                        localStorage.setItem('aliceActionsCompleted', JSON.stringify(actionsCompleted));
                        foodBtn.classList.add('completed');
                        // Даем меньше XP за выполнение действия на высоких уровнях
                        const xpReward = Math.max(5, 25 - Math.floor(level / 2));
                        addXP(xpReward);
                        checkActionsCompletion();
                    }
                    
                    if (foodItemsEaten >= 3) {
                        setTimeout(spawnFood, 500);
                    }
                }, 300);
            } else {
                activeFoodItem.classList.remove('dragging');
                activeFoodItem.style.position = '';
                activeFoodItem.style.left = '';
                activeFoodItem.style.top = '';
            }
            
            activeFoodItem = null;
        }
        
        function checkCollision(rect1, rect2) {
            return !(
                rect1.right < rect2.left || 
                rect1.left > rect2.right || 
                rect1.bottom < rect2.top || 
                rect1.top > rect2.bottom
            );
        }
        
        function createToiletDoor() {
            const toiletRoom = document.getElementById('toiletBg');
            
            // Создаем дверь

        function setupDoorInteraction() {
            let startX = 0;
            let isDragging = false;
            
            // Добавляем обработчики для мыши
            toiletDoor.addEventListener('mousedown', function(e) {
                isDragging = true;
                startX = e.clientX;
                e.preventDefault();
            });
            
            // Добавляем обработчики для touch-устройств
            toiletDoor.addEventListener('touchstart', function(e) {
                isDragging = true;
                startX = e.touches[0].clientX;
                e.preventDefault();
            }, { passive: false });
            
            // Обработчик движения для мыши
            document.addEventListener('mousemove', function(e) {
                if (!isDragging || !toiletDoor) return;
                
                const moveX = e.clientX - startX;
                const newPosition = Math.min(0, Math.max(-15, moveX / 10));
                
                if (toiletUsed) {
                    openDoor();
                    return;
                }
                
                toiletDoor.style.transform = `translateX(${newPosition}vh) translateY(-50%)`;
                
                // Обновляем прогресс для туалета
                if (!actionsCompleted.toilet) {
                    actionsProgress.toilet = Math.min(100, Math.abs(newPosition) / 15 * 100);
                    updateActionsProgress();
                }
                
                if (newPosition <= -12 && !isDoorMoving) {
                    closeDoor();
                }
            });
            
            // Обработчик движения для touch-устройств
            document.addEventListener('touchmove', function(e) {
                if (!isDragging || !toiletDoor) return;
                
                const moveX = e.touches[0].clientX - startX;
                const newPosition = Math.min(0, Math.max(-15, moveX / 10));
                
                if (toiletUsed) {
                    openDoor();
                    return;
                }
                
                toiletDoor.style.transform = `translateX(${newPosition}vh) translateY(-50%)`;
                
                // Обновляем прогресс для туалета
                if (!actionsCompleted.toilet) {
                    actionsProgress.toilet = Math.min(100, Math.abs(newPosition) / 15 * 100);
                    updateActionsProgress();
                }
                
                if (newPosition <= -12 && !isDoorMoving) {
                    closeDoor();
                }
                
                e.preventDefault();
            }, { passive: false });
            
            // Обработчик отпускания для мыши
            document.addEventListener('mouseup', function() {
                if (!isDragging) return;
                isDragging = false;
                
                if (!isDoorMoving && !toiletUsed) {
                    toiletDoor.style.transform = 'translateX(0) translateY(-50%)';
                }
            });
            
            // Обработчик отпускания для touch-устройств
            document.addEventListener('touchend', function() {
                if (!isDragging) return;
                isDragging = false;
                
                if (!isDoorMoving && !toiletUsed) {
                    toiletDoor.style.transform = 'translateX(0) translateY(-50%)';
                }
            });
        }

        function closeDoor() {
            if (isDoorMoving) return;
            
            isDoorMoving = true;
            toiletDoor.style.transform = 'translateX(-15vh) translateY(-50%)';
            
            doorTimeout = setTimeout(() => {
                openDoor();
                toiletUsed = true;
                
                // Помечаем действие как выполненное
                if (!actionsCompleted.toilet) {
                    actionsCompleted.toilet = true;
                    localStorage.setItem('aliceActionsCompleted', JSON.stringify(actionsCompleted));
                    toiletBtn.classList.add('completed');
                    // Даем меньше XP за выполнение действия на высоких уровнях
                    const xpReward = Math.max(5, 25 - Math.floor(level / 2));
                    addXP(xpReward);
                    checkActionsCompletion();
                }
            }, 5000);
        }

        function openDoor() {
            isDoorMoving = false;
            toiletDoor.style.transform = 'translateX(0) translateY(-50%)';
            if (doorTimeout) {
                clearTimeout(doorTimeout);
                doorTimeout = null;
            }
        }

                if (foodItems.children.length === 0) {
                    spawnFood();

        }
        
        function toggleLight() {
            isLightOn = !isLightOn;
            darkOverlay.style.display = isLightOn ? 'none' : 'block';
            sleepTimer.style.display = isLightOn ? 'none' : 'block';
            
            if (!isLightOn && !actionsCompleted.sleep && !isSleeping) {
                startSleepTimer();
            }
        }
        
        function checkActionsCompletion() {
            // Проверяем, все ли действия выполнены
            if (actionsCompleted.smile && actionsCompleted.food && 
                actionsCompleted.toilet && actionsCompleted.sleep) {
                
                // Начисляем кристаллы и токены за завершенный день
                crystals += 1;
                tokens += 50;
                localStorage.setItem('aliceCrystals', crystals.toString());
                localStorage.setItem(`aliceTokens_season_${passConfig.Season}`, tokens.toString());
                updateCounters();
                
                // Сбрасываем выполненные действия для нового дня
                resetDailyActions();
            }
        }
        
        function resetDailyActions() {
            actionsCompleted = {
                smile: false,
                food: false,
                toilet: false,
                sleep: false
            };
            
            actionsProgress = {
                smile: 0,
                food: 0,
                toilet: 0,
                sleep: 0
            };
            
            // Сбрасываем счетчик кликов для квестов при новом дне
            questClicks.clicksForQuests = 0;
            questClicks.lastResetTime = Date.now();
            localStorage.setItem('aliceQuestClicks', JSON.stringify(questClicks));
            
            localStorage.setItem('aliceActionsCompleted', JSON.stringify(actionsCompleted));
            localStorage.setItem('aliceActionsProgress', JSON.stringify(actionsProgress));
            updateButtonsState();
            updateActionsProgress();
            
            // Сбрасываем состояния комнат
            toiletUsed = false;
            if (toiletDoor) {
                openDoor();
            }
            
            // Перезапускаем еду
            if (document.getElementById('foodBg').style.display === 'block') {
                spawnFood();
            }
            
            // Сбрасываем таймер сна
            if (sleepInterval) {
                clearInterval(sleepInterval);
                sleepInterval = null;
            }
            isSleeping = false;
            sleepTimer.style.display = 'none';
        }
        
        function showSettingsModal() {
            settingsModal.classList.add('active');
        }
        
        function hideSettingsModal() {
            settingsModal.classList.remove('active');
        }
        
        function showCostumesModal() {
            costumesModal.classList.add('active');
            showCostumes();
        }
        
        function hideCostumesModal() {
            costumesModal.classList.remove('active');
        }
        
        function showShopModal() {
            shopModal.classList.add('active');
            promoCodeInput.value = "";
            promoResult.textContent = "";
            promoResult.className = "promo-result";
            showStocks();
        }
        
        function hideShopModal() {
            shopModal.classList.remove('active');
        }
        
        function showStocks() {
            shopContainer.innerHTML = '';
            
            // Добавляем акции в магазин
            for (const [key, stock] of Object.entries(stocks)) {
                // Показываем только доступные и некупленные акции
                if (!purchasedStocks[key] && clickCount >= stock.requirements.clicks && level >= stock.requirements.level) {
                    const stockItem = document.createElement('div');
                    stockItem.className = 'shop-item';
                    
                    stockItem.innerHTML = `
                        <img src="${stock.title}" class="shop-image" alt="${stock.name}">
                    `;
                    
                    stockItem.addEventListener('click', () => purchaseStock(key));
                    shopContainer.appendChild(stockItem);
                }
            }
            
            // Если нет доступных акций
            if (shopContainer.children.length === 0) {
                shopContainer.innerHTML = '<div style="text-align: center; padding: 2vh;">Нет доступных акций</div>';
            }
            
            // Настраиваем скролл
            setupShopScroll();
        }
        
        function purchaseStock(stockKey) {
            const stock = stocks[stockKey];
            
            // Проверяем, достаточно ли средств для покупки
            if (stock.price.type !== "free") {
                if (stock.price.type === "clicks" && clickCount < stock.price.value) {
                    showRewardNotification("Недостаточно кликов!");
                    return;
                }
                
                if (stock.price.type === "crystals" && crystals < stock.price.value) {
                    showRewardNotification("Недостаточно кристаллов!");
                    return;
                }
            }
            
            // Списываем средства
            if (stock.price.type === "clicks") {
                clickCount -= stock.price.value;
                localStorage.setItem('aliceClickCount', clickCount.toString());
            } else if (stock.price.type === "crystals") {
                crystals -= stock.price.value;
                localStorage.setItem('aliceCrystals', crystals.toString());
            }
            
            // Добавляем акцию в список купленных
            purchasedStocks[stockKey] = true;
            localStorage.setItem('alicePurchasedStocks', JSON.stringify(purchasedStocks));
            
            // Убираем метку "НОВОЕ!"
            if (newStocks[stockKey]) {
                delete newStocks[stockKey];
                localStorage.setItem('aliceNewStocks', JSON.stringify(newStocks));
            }
            
            // Применяем бонусы из акции
            let message = "Получено: ";
            const bonuses = [];
            
            if (Array.isArray(stock.value)) {
                // Если акция содержит несколько бонусов
                stock.value.forEach(item => {
                    if (typeof item === "string") {
                        // Костюм
                        unlockedCostumes[item] = true;
                        localStorage.setItem('aliceUnlockedCostumes', JSON.stringify(unlockedCostumes));
                        bonuses.push(`костюм "${costumes[item].name}"`);
                    } else {
                        // Клики
                        clickCount += item;
                        localStorage.setItem('aliceClickCount', clickCount.toString());
                        bonuses.push(`${item} кликов`);
                    }
                });
            } else if (stock.type === "pass") {
                // Премиум пасс
                hasPremiumPass = true;
                localStorage.setItem(`aliceHasPremiumPass_season_${passConfig.Season}`, 'true');
                bonuses.push("Premium Pass");
            } else if (stock.type === "clicks") {
                // Клики
                clickCount += stock.value;
                localStorage.setItem('aliceClickCount', clickCount.toString());
                bonuses.push(`${stock.value} кликов`);
            } else if (stock.type === "crystals") {
                // Кристаллы
                crystals += stock.value;
                localStorage.setItem('aliceCrystals', crystals.toString());
                bonuses.push(`${stock.value} кристаллов`);
            }
            
            message += bonuses.join(" и ");
            
            // Обновляем счетчики
            updateCounters();
            checkUnlockedCostumes();
            
            // Показываем результат покупки
            showRewardNotification(message);
            
            // Обновляем магазин
            showStocks();
        }
        
        function setupShopScroll() {
            const container = shopContainer;
            const scrollbar = document.getElementById('shopScrollbarThumb');
            
            function updateScrollbar() {
                const scrollRatio = container.scrollLeft / (container.scrollWidth - container.clientWidth);
                const thumbPosition = scrollRatio * (container.clientWidth - scrollbar.clientWidth);
                scrollbar.style.left = `${thumbPosition}px`;
            }
            
            container.addEventListener('scroll', updateScrollbar);
            
            // Обработчик для перемещения скролла при перетаскивании ползунка
            let isDragging = false;
            let startX;
            
            scrollbar.addEventListener('mousedown', function(e) {
                isDragging = true;
                startX = e.clientX;
                e.preventDefault();
            });
            
            scrollbar.addEventListener('touchstart', function(e) {
                isDragging = true;
                startX = e.touches[0].clientX;
                e.preventDefault();
            }, { passive: false });
            
            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                
                const deltaX = e.clientX - startX;
                const containerWidth = container.clientWidth;
                const scrollWidth = container.scrollWidth;
                
                const scrollRatio = deltaX / containerWidth;
                container.scrollLeft = scrollRatio * (scrollWidth - container.clientWidth);
                
                startX = e.clientX;
            });
            
            document.addEventListener('touchmove', function(e) {
                if (!isDragging) return;
                
                const deltaX = e.touches[0].clientX - startX;
                const containerWidth = container.clientWidth;
                const scrollWidth = container.scrollWidth;
                
                const scrollRatio = deltaX / containerWidth;
                container.scrollLeft = scrollRatio * (scrollWidth - container.clientWidth);
                
                startX = e.touches[0].clientX;
                e.preventDefault();
            }, { passive: false });
            
            document.addEventListener('mouseup', function() {
                isDragging = false;
            });
            
            document.addEventListener('touchend', function() {
                isDragging = false;
            });
            
            updateScrollbar();
        }
        
        function showCostumes() {
            costumesContainer.innerHTML = '';
            
            // Создаем категорию "Доступные"
            const availableCategory = document.createElement('div');
            availableCategory.className = 'costume-category';
            availableCategory.innerHTML = '<div class="costume-category-title">Доступные</div><div class="costume-grid" id="availableCostumes"></div>';
            costumesContainer.appendChild(availableCategory);
            
            const availableGrid = document.getElementById('availableCostumes');
            
            // Создаем категорию "Заблокированные"
            const lockedCategory = document.createElement('div');
            lockedCategory.className = 'costume-category';
            lockedCategory.innerHTML = '<div class="costume-category-title">Заблокированные</div><div class="costume-grid" id="lockedCostumes"></div>';
            costumesContainer.appendChild(lockedCategory);
            
            const lockedGrid = document.getElementById('lockedCostumes');
            
            // Добавляем костюмы в соответствующие категории
            for (const [key, costume] of Object.entries(costumes)) {
                const costumeItem = document.createElement('div');
                costumeItem.className = `costume-item ${unlockedCostumes[key] ? '' : 'locked'}`;
                if (selectedCostume === key) {
                    costumeItem.classList.add('selected-costume');
                }
                
                costumeItem.innerHTML = `
                    <img src="${costume.titleImage}" class="costume-image" alt="${costume.name}">
                    <div class="costume-name">${costume.name}</div>
                    <div class="costume-info">${costume.infoText}</div>
                    <div class="costume-price ${unlockedCostumes[key] ? '' : 'locked'}">
                        ${unlockedCostumes[key] ? 'Доступен' : costume.priceText}
                    </div>
                `;
                
                if (unlockedCostumes[key]) {
                    costumeItem.addEventListener('click', () => selectCostume(key));
                    availableGrid.appendChild(costumeItem);
                } else {
                    lockedGrid.appendChild(costumeItem);
                }
            }
            
            // Настраиваем скролл
            setupCostumesScroll();
        }
        
        function selectCostume(costumeKey) {
            selectedCostume = costumeKey;
            localStorage.setItem('aliceSelectedCostume', selectedCostume);
            loadSelectedCostume();
            showCostumes(); // Обновляем список костюмов, чтобы показать новый выбранный
        }

                const scrollWidth = container.scrollWidth;
                
                const scrollRatio = deltaX / containerWidth;
                container.scrollTop = scrollRatio * (scrollWidth - container.clientWidth);
                
                startX = e.touches[0].clientX;
                e.preventDefault();
            }, { passive: false });
            
            document.addEventListener('mouseup', function() {

            document.addEventListener('touchend', function() {

        function showManualModal() {
            manualModal.classList.add('active');
            manualPage = 1;
            updateManualPage();
        }
        
        function hideManualModal() {
            manualModal.classList.remove('active');
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            initAlice();
            lightSwitch.addEventListener('click', toggleLight);
            
            howToPlayBtn.addEventListener('click', showManualModal);
            backFromSettingsBtn.addEventListener('click', hideSettingsModal);
            backFromCostumesBtn.addEventListener('click', hideCostumesModal);
            backFromShopBtn.addEventListener('click', hideShopModal);
            backFromPassBtn.addEventListener('click', hidePassModal);
            backFromManualBtn.addEventListener('click', hideManualModal);
        });
    </script>
